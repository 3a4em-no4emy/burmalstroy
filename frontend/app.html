<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>БурмалСТРОЙ</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">БурмалСТРОЙ</div>
    <nav class="nav" id="nav"></nav>
    <div class="user-box">
      <span id="user-name"></span>
      <span class="badge" id="user-role"></span>
      <button class="btn ghost" id="notif-btn">🔔 <span id="notif-count" class="dot hidden">0</span></button>
      <button class="btn ghost" id="logout">Выйти</button>
    </div>
  </header>

  <main id="main"></main>

  <div id="toast" class="toast hidden"></div>

  <div class="modal hidden" id="modal">
    <div class="modal-card">
      <button class="modal-close" id="modal-close">×</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
