<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>БурмалСТРОЙ - Вход</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
  <div class="auth-card">
    <h1>ОБЩАГА</h1>
    <p class="muted">Система подачи заявок</p>
    
    <form id="login-form" class="form">
      <h3>Вход</h3>
      <label>Логин <input type="text" name="login" required></label>
      <label>Пароль <input type="password" name="password" required></label>
      <button type="submit" class="btn primary">Войти</button>
    </form>

    <hr>

    <form id="register-form" class="form">
      <h3>Регистрация</h3>
      <label>ФИО <input type="text" name="full_name" required></label>
      <label>Логин <input type="text" name="login" required></label>
      <label>Пароль <input type="password" name="password" required></label>
      <label>Роль 
        <select name="role">
          <option value="student">Студент</option>
          <option value="specialist">Специалист</option>
          <option value="manager">Заведующий</option>
        </select>
      </label>
      <button type="submit" class="btn">Зарегистрироваться</button>
    </form>
    <div id="error" class="form-error"></div>
  </div>
  <script src="js/auth.js"></script>
</body>
</html>
